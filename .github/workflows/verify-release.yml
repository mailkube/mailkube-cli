name: Verify release

# Installs the published release the way a user would, on every channel, and asserts that each one
# yields the version that was released.
#
# Nothing here reads the repository's build output. Every job starts from what was actually
# published, because the failure this exists to catch is a release that built correctly and
# published wrong: an asset missing from one archive, a checksum covering a file nobody uploaded,
# a channel still serving last week.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to verify, for example v1.2.3.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to verify, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: read

jobs:
  installers:
    # The install scripts are run, not linted. Linting proves the syntax; running proves the
    # download, the checksum comparison, the signature check, the extraction and the resulting
    # binary. cosign is installed first on purpose, so the signature path is exercised rather
    # than taking the branch that skips it.
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The same version the release was signed with, so this measures the installers rather than
      # a skew between two cosign releases.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install from the release
        if: runner.os != 'Windows'
        env:
          MAILKUBE_VERSION: ${{ inputs.tag }}
        run: |
          curl -fsSL "https://github.com/mailkube/mailkube-cli/releases/download/${MAILKUBE_VERSION}/install.sh" -o install.sh
          MAILKUBE_INSTALL_DIR="$HOME/.mailkube/bin" sh install.sh
          echo "$HOME/.mailkube/bin" >> "$GITHUB_PATH"

      - name: Install from the release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MAILKUBE_VERSION: ${{ inputs.tag }}
        run: |
          $url = "https://github.com/mailkube/mailkube-cli/releases/download/$env:MAILKUBE_VERSION/install.ps1"
          Invoke-WebRequest -Uri $url -OutFile install.ps1 -UseBasicParsing
          ./install.ps1 -InstallDir "$env:USERPROFILE\mailkube"
          "$env:USERPROFILE\mailkube" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The installed binary reports the released version
        shell: bash
        run: |
          reported=$(mailkube version --json | jq -r .version)
          [ "$reported" = "${{ inputs.tag }}" ] || {
            echo "Installed ${reported}, expected ${{ inputs.tag }}."
            exit 1
          }
          echo "OK: ${reported}"

      # The one command whose absence would be noticed immediately, and the one screen that
      # proves the binary can reach its own embedded content rather than merely start.
      - name: The binary works
        shell: bash
        run: |
          mailkube --help > /dev/null
          mailkube errors explain quota_exceeded > /dev/null

      # Apple Silicon refuses to run an entirely unsigned binary, and the toolchain signs the
      # arm64 build for exactly that reason. macOS is Apple Silicon only here, so this reads one
      # architecture and there is no second slice whose result could differ.
      #
      # The quarantine check is the other half. macOS refuses a marked binary with a message
      # that does not mention the mark, so an install that left one would look like a broken
      # download to everyone who hit it.
      - name: The macOS binary is signed and unmarked
        if: runner.os == 'macOS'
        run: |
          codesign -v "$(command -v mailkube)"
          echo "OK: the binary carries a valid signature."
          if xattr -p com.apple.quarantine "$(command -v mailkube)" 2>/dev/null; then
            echo "The installed binary is marked as quarantined."
            exit 1
          fi
          echo "OK: no quarantine attribute."

  go-install:
    # From an empty module, with the module proxy as the only source. This is the channel a
    # `replace` directive in the committed go.mod would silently break, and the break would be
    # invisible in every other job because they all build from a checkout.
    name: go install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          check-latest: true

      - name: Install from the module proxy
        run: |
          cd "$(mktemp -d)"
          go mod init verify >/dev/null
          GOFLAGS=-mod=mod go install "github.com/mailkube/mailkube-cli/cmd/mailkube@${{ inputs.tag }}"

      - name: The installed binary reports the released version
        run: |
          reported=$("$(go env GOPATH)/bin/mailkube" version --json | jq -r .version)
          [ "$reported" = "${{ inputs.tag }}" ] || {
            echo "Installed ${reported}, expected ${{ inputs.tag }}."
            exit 1
          }
          echo "OK: ${reported}"

  image:
    # The container image, exercised through the one command that behaves differently inside one.
    # A published port cannot reach the container's own loopback interface, so `webhooks listen`
    # has to be told to bind elsewhere, and an image that cannot do that is an image that cannot
    # run the command it ships.
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The image reports the released version
        run: |
          version="${{ inputs.tag }}"
          image="ghcr.io/mailkube/mailkube-cli:${version#v}"
          reported=$(docker run --rm "$image" version --json | jq -r .version)
          [ "$reported" = "$version" ] || {
            echo "The image reports ${reported}, expected ${version}."
            exit 1
          }
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # A local install supplies the sender. Using the released binary rather than a checkout
      # keeps this a test of what was published on both ends.
      - name: Install the CLI on the runner
        env:
          MAILKUBE_VERSION: ${{ inputs.tag }}
        run: |
          curl -fsSL "https://github.com/mailkube/mailkube-cli/releases/download/${MAILKUBE_VERSION}/install.sh" -o install.sh
          MAILKUBE_INSTALL_DIR="$HOME/.mailkube/bin" sh install.sh
          echo "$HOME/.mailkube/bin" >> "$GITHUB_PATH"

      - name: A signed delivery reaches a listener inside the image
        env:
          MAILKUBE_WEBHOOK_SECRET: 6f1d9ac0e4b74c2f8d3a5b6c7e8f90112233445566778899aabbccddeeff0011
        run: |
          # No --rm. The container exits by itself once --exit-after is satisfied, and a
          # self-removing container takes its exit code and its logs with it, so everything below
          # would be racing a container that is deleting itself.
          docker run --name listener -d -p 4318:4318 \
            -e MAILKUBE_WEBHOOK_SECRET \
            "$IMAGE" webhooks listen --local --host 0.0.0.0 --exit-after 1 --exit-timeout 60s

          # The listener binds before it prints anything, so waiting on the port is waiting on
          # the thing under test rather than on a fixed number of seconds.
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:4318/" 2>/dev/null || nc -z 127.0.0.1 4318; then
              break
            fi
            sleep 1
          done

          mailkube webhooks simulate --url http://127.0.0.1:4318 --event email.delivered

          # --exit-after 1 was satisfied, so the container exits 0 on its own. A non-zero status
          # here means the delivery never arrived or never verified.
          #
          # docker wait blocks until it exits and prints the code, so it is the sole reader of the
          # result and there is no second command to disagree with it. --exit-timeout bounds the
          # wait. An unreadable status fails the step: the previous fallback defaulted it to zero,
          # turning "could not tell" into "passed" on the one assertion this job exists to make.
          status=$(docker wait listener)
          docker logs listener 2>&1 || true
          docker rm -f listener >/dev/null 2>&1 || true
          [ "$status" = "0" ] || {
            echo "The listener exited ${status}."
            exit 1
          }

  channels:
    # The two channels that publish to a repository of their own. They are the ones that can fall
    # behind without anything going red, so they are the ones asserted against the released
    # version rather than assumed to have worked.
    name: ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: Homebrew
            os: macos-latest
          - channel: Scoop
            os: windows-latest
    steps:
      - name: Install through Homebrew
        if: matrix.channel == 'Homebrew'
        run: |
          brew tap mailkube/tap https://github.com/mailkube/homebrew-tap
          brew install --cask mailkube/tap/mailkube
          reported=$(mailkube version --json | jq -r .version)
          [ "$reported" = "${{ inputs.tag }}" ] || {
            echo "Homebrew serves ${reported}, expected ${{ inputs.tag }}."
            exit 1
          }
          echo "OK: ${reported}"

      - name: Install through Scoop
        if: matrix.channel == 'Scoop'
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
          scoop bucket add mailkube https://github.com/mailkube/scoop-bucket
          scoop install mailkube/mailkube
          $reported = (mailkube version --json | ConvertFrom-Json).version
          if ($reported -ne "${{ inputs.tag }}") {
            throw "Scoop serves $reported, expected ${{ inputs.tag }}."
          }
          Write-Output "OK: $reported"
