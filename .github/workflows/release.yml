name: Release

# Conventional-Commits-driven release. The commit history decides the version, the tag carries it,
# and nothing is committed back to `main`.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    # Release only proceeds if the full gated CI is green. Nothing downstream re-runs the tests,
    # so this is the only thing standing between a red build and a published binary.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  tag:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # push the tag, create the GitHub Release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Creates the TAG and the GitHub Release, and nothing else. No `@semantic-release/git` and
      # no `@semantic-release/changelog` on purpose: a bot commit to `main` would be rejected by
      # the branch ruleset, and github-actions[bot] cannot be added to a ruleset bypass list. The
      # release notes are the changelog. See .rules/RELEASE.md.
      #
      # The before/after comparison is how the rest of the workflow learns whether a release
      # happened. A tag pushed with the workflow's own token does not trigger `on: push: tags`, so
      # a downstream workflow listening for one would simply never run, and the failure mode is a
      # release with no artifacts on it: a green run that published nothing.
      - name: Release (tag + GitHub Release, no commit, no registry publish)
        id: release
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx --yes -p semantic-release semantic-release
          git fetch --tags --force
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          if [ "$before" = "$after" ]; then
            echo "No release: nothing since ${before} changes the version."
            exit 0
          fi

          echo "Released ${after}."
          echo "tag=${after}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    # Skipped when the merge was a `chore`, `docs`, `ci`, `refactor` or `test` and no version was
    # cut. Publishing is keyed on a tag existing, never on the workflow having run.
    needs: tag
    if: needs.tag.outputs.tag != ''
    # A called workflow cannot hold more than the job that calls it, so these are granted here
    # even though publish.yml declares them again on its own jobs. This is not the same rule as
    # for an ordinary job, where a job-level block raises the workflow default freely: a caller
    # is a ceiling, and a callee asking for more than its ceiling does not fail at that step. It
    # fails before any job starts, with no log to read.
    permissions:
      contents: write # append artifacts to the release
      packages: write # push images
      id-token: write # keyless signing, and the provenance attestation
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  verify:
    # Installs what was just published, on every channel, and checks that each yields the version
    # that was released. It runs after the fact by necessity: it can only test artifacts that
    # exist. A failure here means a channel needs re-running, not that the release is void.
    needs: [tag, publish]
    if: needs.tag.outputs.tag != ''
    # Reads the published release the way a user does, over anonymous HTTP, so it needs nothing.
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
