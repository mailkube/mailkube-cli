name: CI

on:
  # No `push: branches: [main]` trigger on purpose. release.yml already runs this entire workflow
  # through `workflow_call` on every push to `main`, and both runs land in the same
  # `ci-${{ github.ref }}` concurrency group with cancel-in-progress. A direct trigger therefore
  # only ever races the gated one: one of the two is cancelled, and the cancelled run is what the
  # README's CI badge reports. `main` stays fully covered by release.yml's ci-gate job.
  pull_request:
  workflow_call: # so release.yml can gate on the full CI

# Read-only by default. A job that needs more says so itself, so widening a permission is a
# visible diff on the job that widened it rather than a workflow-wide default nobody reads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Three operating systems, not one. This ships a binary to end users, and the things that
    # break are OS-specific: signal handling, the config directory, the file permission model,
    # terminal detection, and CRLF in anything the tests compare byte-for-byte. A green
    # ubuntu-only run tells us almost nothing about the Windows build.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One Go version, deliberately, and it is the module's own floor rather than a range.
        # Two reasons, and only the second is about this repository:
        #
        #   - the version story reads the module version out of the build info the toolchain
        #     stamps from the VCS tag, so anything below the floor would produce a binary
        #     reporting a different version than the one it ships as;
        #   - `vuln` reports the standard library the build actually uses, so a row on a release
        #     that no longer receives security fixes turns a real gate into a permanent failure.
        #
        # Raise this together with the `go` directive in go.mod, never separately.
        go-version: ["1.25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      # Lint and format run once, on Linux: they inspect source, not platform behaviour, and
      # running them three times only triples the chance of a flake blocking a merge.
      - name: Lint (golangci-lint — complexity, docs, SOLID smells, staticcheck)
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Format check (gofumpt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          if [ -n "$(gofumpt -l .)" ]; then
            echo "gofumpt: the following files need formatting:"
            gofumpt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race needs cgo and a supported architecture, so it is the amd64 rows only. cgo stays
      # enabled here; CGO_ENABLED=0 is a release-build setting, not a test setting.
      - name: Tests + coverage (race)
        if: matrix.os != 'macos-latest'
        run: go test ./... -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      - name: Tests + coverage
        if: matrix.os == 'macos-latest'
        run: go test ./... -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      # One row publishes the number. -coverpkg=./... matters: without it a package with no test
      # file is absent from the profile entirely, so the gate would be passable by not writing
      # tests at all.
      - name: Coverage gate (90% line)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check-coverage.sh coverage.out

  dry:
    # Language-agnostic duplication (DRY) gate — identical across every mailkube repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Copy-paste detection (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.json .

  surface:
    # Parity gate: the CLI's coverage of the published surface, checked against the SDK's own
    # source rather than against a list copied into this repository.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: Surface parity
        run: ./scripts/check-surface.sh

  docs:
    # Governance gates: what the repository says about itself has to still be true.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rule-index sync check
        run: ./scripts/check-rule-index.sh
      # The version has one source, and this is what keeps it that way. An enforcement script
      # wired to no job is a comment, so it runs here rather than in a nightly nobody watches.
      - name: No version literal in source
        run: ./scripts/check-no-version-literal.sh

  shell:
    # The installers are the only code in this repository that runs on a stranger's machine, with
    # permission to write to a directory on their PATH, before they have any reason to trust it.
    # Two files, and they get their own gate for that reason alone.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true

      # Every shell script, not only the installer: the release pipeline runs the ones under
      # scripts/ too, and a quoting bug there fails a release rather than a pull request.
      - name: Lint shell (shellcheck)
        run: shellcheck install.sh scripts/*.sh

      - name: Format check (shfmt)
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          shfmt -d install.sh scripts/*.sh

      # Findings at Warning and above fail. PowerShell's own analyzer catches the class of
      # mistake that matters here: a parameter that is never used, a variable that is never
      # assigned, an alias that is not available on the version the script declares it supports.
      - name: Lint PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning
          if ($findings) {
            $findings | Format-Table -AutoSize
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: no findings.'

  vuln:
    # Reachability-based, so it reports vulnerabilities in code this binary actually calls rather
    # than in every package the module graph mentions. That is what makes it usable as a gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  release-config:
    # The release configuration is checked on every pull request, not first exercised on the day
    # a release is cut. A build that only ever runs at release time is a build nobody has run.
    #
    # NOT one of the required checks. The required set is deliberately small, and this job is the
    # newest of them; whether it earns a place there is a decision for when branch protection is
    # configured, once its failure rate is something observed rather than assumed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from the tag history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

      # A snapshot exercises the builds, the archives, the packages and both channel manifests
      # without publishing anything. Signing, images and SBOMs need credentials or a registry, so
      # they are skipped here and covered by the release run itself.
      - name: Snapshot build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,docker,sign,sbom,announce

      # The completions in the archive are generated, so the check that matters is that the
      # generator left the tracked tree alone. If it did not, every release binary would report a
      # version marked dirty, and the first person to notice would be a user reading `version`.
      - name: The build must leave the checkout clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The release build modified tracked files:"
            git status --porcelain
            exit 1
          fi
