# Run `pre-commit install && pre-commit install --hook-type commit-msg` after cloning.
# Requires the Go toolchain, golangci-lint (v2), gofumpt, and Node (for jscpd) on PATH.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt (format)
        entry: gofumpt -w
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

  # Language-agnostic DRY gate — identical config in every mailkube repo.
  - repo: local
    hooks:
      - id: jscpd
        name: jscpd (copy-paste detector)
        entry: npx --yes jscpd@4 --config .jscpd.json .
        language: system
        pass_filenames: false

  # Enforce Conventional Commits on the commit message (matches the org house style).
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
