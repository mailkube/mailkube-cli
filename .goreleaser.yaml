# Release build. One tag in, every channel out.
#
# The pipeline is deliberately reproducible: `-trimpath` strips local paths, `CGO_ENABLED=0`
# removes the host toolchain from the result, and `mod_timestamp` pins every archive entry to the
# commit time rather than the build time. Two runs of the same tag therefore produce identical
# bytes, which is what makes a channel job safe to re-run on its own.
version: 2

project_name: mailkube

before:
  hooks:
    # Shell completions are generated from the command tree, not written by hand, so a new command
    # cannot ship with a completion file that has never heard of it. They land in an ignored
    # directory: a generated file anywhere tracked would mark the checkout dirty, and a dirty
    # checkout makes the toolchain stamp the binary with a version that is not the released one.
    - ./scripts/gen-completions.sh

builds:
  - id: mailkube
    main: ./cmd/mailkube
    binary: mailkube
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Only the symbol table and DWARF are stripped. The version is NOT injected here: the
    # toolchain stamps the module version from the VCS tag and the binary reads it back out of
    # its own build info, so there is no linker flag and no literal to keep in step. Build
    # information survives -s -w; it lives in its own section.
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      # 32-bit ARM exists on Linux boards and nowhere else this tool ships.
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      # macOS is Apple Silicon only. That also makes the signing story exact rather than
      # conditional: the toolchain ad-hoc signs an arm64 build and does not sign an amd64 one, so
      # a single-architecture macOS binary is signed, full stop, with no second slice that is
      # correct while carrying no signature.
      - goos: darwin
        goarch: amd64

archives:
  - id: mailkube
    ids: [mailkube]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  # One SBOM per archive, so a consumer can answer "what is inside the thing I downloaded"
  # against the artifact they actually have rather than against the source tree.
  - id: archive
    artifacts: archive

signs:
  # Keyless signing over the checksum file. Signing the checksums rather than each archive is
  # what makes the whole release verifiable from one signature: the checksum file covers every
  # artifact, and the signature covers the checksum file.
  #
  # One Sigstore bundle, not a separate signature and certificate. The bundle carries both, plus
  # the transparency-log entry that proves when it was signed, so verification needs one file
  # instead of three agreeing with each other.
  #
  # These flags are tied to the cosign major version, which is why the workflows pin it rather
  # than taking whatever the installer offers. cosign 3 made this format the default and turned
  # the older `--output-signature` / `--output-certificate` pair into flags it accepts, warns
  # about and then ignores, which fails as a missing bundle path rather than as a bad flag.
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

nfpms:
  # Distribution packages are release artifacts, not a hosted repository: download one and
  # install it. There is nothing to add to a sources list and nothing that auto-updates.
  - id: mailkube
    ids: [mailkube]
    package_name: mailkube
    vendor: Mailkube
    homepage: https://docs.mailkube.com/cli
    maintainer: Mailkube <support@mailkube.com>
    description: Send mail, manage scheduled sends, and receive webhooks from your terminal.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: completions/mailkube.bash
        dst: /usr/share/bash-completion/completions/mailkube
      - src: completions/mailkube.zsh
        dst: /usr/share/zsh/site-functions/_mailkube
      - src: completions/mailkube.fish
        dst: /usr/share/fish/vendor_completions.d/mailkube.fish
      - src: LICENSE
        dst: /usr/share/doc/mailkube/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/mailkube/NOTICE

dockers_v2:
  # The image carries the binary and nothing else: no shell, no package manager, no interpreter.
  # `webhooks listen` is the one command that needs a bind address other than loopback here,
  # because a published container port cannot reach the container's own loopback interface.
  #
  # One entry covers both architectures: the multi-architecture index is published alongside the
  # per-architecture images, so `docker pull …:1.2.3` resolves correctly with no suffix to guess.
  - id: mailkube
    ids: [mailkube]
    dockerfile: Dockerfile
    images:
      - ghcr.io/mailkube/mailkube-cli
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: The Mailkube command-line interface
      org.opencontainers.image.url: https://docs.mailkube.com/cli
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

homebrew_casks:
  # Generated here, pushed by a separate job. Writing to another repository is the one step in
  # this pipeline that depends on a credential for something outside it, so it is kept out of the
  # run that publishes the release: a failure there must not be able to leave the release itself
  # half-made, and the retry must not rebuild anything.
  - name: mailkube
    ids: [mailkube]
    skip_upload: true
    repository:
      owner: mailkube
      name: homebrew-tap
    homepage: https://docs.mailkube.com/cli
    description: Send mail, manage scheduled sends, and receive webhooks from your terminal.
    license: Apache-2.0
    binaries: [mailkube]
    completions:
      bash: completions/mailkube.bash
      zsh: completions/mailkube.zsh
      fish: completions/mailkube.fish
    # macOS is Apple Silicon only: there is no darwin/amd64 build (see .rules/DISTRIBUTION.md), so
    # the generated on_macos block below carries only on_arm, with no url at all for on_intel.
    # Left alone, brew resolves that as "attempted to use a Downloadable without a URL!", which
    # names no cause. This stanza is additive, not a replacement: Homebrew evaluates every
    # on_macos block in the file, so it runs alongside the generated one and stops an on_intel
    # resolution before brew goes looking for a url that was never going to exist.
    #
    # on_intel fires for real Intel hardware, but also for Apple Silicon under a Rosetta-run
    # Homebrew (commonly the /usr/local prefix installed before switching, left in place beside
    # /opt/homebrew): Hardware::CPU.type reflects the running process, not the physical chip. The
    # message covers both, since a user hitting this has no way to tell which one they are from
    # the error alone.
    custom_block: |
      on_macos do
        on_intel do
          odie "No Intel build of mailkube exists. If this is Apple Silicon hardware, you are likely running an x86_64 Homebrew (often /usr/local, installed under Rosetta) instead of the native one at /opt/homebrew - check `brew --prefix` and reinstall via the native prefix. Otherwise, on a genuine Intel Mac, install with: go install github.com/mailkube/mailkube-cli/cmd/mailkube@latest"
        end
      end
    hooks:
      post:
        # macOS marks anything a browser downloaded, and refuses to run it with an error that
        # does not say so. Clearing the mark after install is what keeps `brew install` followed
        # by `mailkube` working in one step.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mailkube"]
          end

scoops:
  - name: mailkube
    ids: [mailkube]
    skip_upload: true
    repository:
      owner: mailkube
      name: scoop-bucket
    homepage: https://docs.mailkube.com/cli
    description: Send mail, manage scheduled sends, and receive webhooks from your terminal.
    license: Apache-2.0

release:
  # The release is drafted before this runs and published by it, in that order, because a
  # published release cannot be added to. GitHub seals a release on publication: its assets and
  # its tag are fixed from that moment, and an upload afterwards is refused outright. So the
  # version is decided from the commit history and the notes are written into a DRAFT, this job
  # fills that draft with every artifact, and publishing it is the last thing that happens.
  #
  # `use_existing_draft` is what points this at that draft. Without it the draft is passed over,
  # the already-published release is found by tag instead, and every upload fails.
  #
  # The draft is matched by NAME, not by tag, so the name the notes are drafted under and the name
  # below have to be the same string. Both sides spell it `v1.2.3` today; changing either alone
  # means this job quietly stops finding the draft it is meant to fill.
  use_existing_draft: true
  name_template: "{{ .Tag }}"

  # The notes are already written and are the changelog, so nothing is added to them here. This
  # setting is about the release BODY rather than the artifacts, which is easy to misread.
  mode: keep-existing

  # Only reachable while the release is still a draft, which is exactly when it is needed: a
  # publish that failed part-way left one behind, and the re-run replaces what it uploaded rather
  # than failing on the duplicate.
  replace_existing_artifacts: true
  github:
    owner: mailkube
    name: mailkube-cli
  extra_files:
    # The installers ship as release assets so the documented one-liner resolves against the
    # release itself. Serving them from a branch would mean the script a user runs and the
    # release it installs could be different things.
    - glob: install.sh
    - glob: install.ps1

changelog:
  # The release notes are written from the commit history when the release is created. Generating
  # a second changelog here would append a differently-worded copy of the same thing.
  disable: true
